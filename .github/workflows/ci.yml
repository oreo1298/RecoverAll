name: CI

on:
  push:
  pull_request:

env:
  # the tools the tests build filesystem images with, and the ones RecoverAll runs
  DISK_TOOLS: >-
    libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fdisk dosfstools mtools exfatprogs exfat-fuse
    ntfs-3g e2fsprogs fuse2fs xfsprogs btrfs-progs hfsprogs xorriso genisoimage sleuthkit gddrescue
    cryptsetup-bin mdadm wimtools makefs qemu-utils ewf-tools ffmpeg

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Runtime libraries and disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DISK_TOOLS
          # exfat-fuse mounts with allow_other: let the tests mount exFAT images as a normal user
          echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: CLI smoke test
        env:
          RALL_DEMO_PACE: "0.02"
        run: |
          recoverctl --version && recoverctl --help > /dev/null
          recoverctl --demo list
          recoverctl --demo photos mmcblk0 "$RUNNER_TEMP/photos"
          recoverctl --demo partitions sda --deep
          recoverctl --demo ls last
          recoverctl formats > /dev/null
          recoverctl doctor

  disks:
    # the same tests as root: loop devices, kernel mounts, FUSE and the fsck tools on attached images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DISK_TOOLS
          sudo modprobe -a loop vfat exfat ntfs3 xfs btrfs hfsplus isofs fuse || true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Tests on disk images (as root)
        env:
          QT_QPA_PLATFORM: offscreen
        run: sudo -E env "PATH=$PATH" "$(command -v python)" -m pytest -q -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check recoverall tests tools
      - run: |
          bash -n packaging/install.sh && bash -n packaging/uninstall.sh && bash -n packaging/update.sh
          bash -n recoverall.sh && sh -n packaging/recoverall-helper && bash -n PKGBUILD

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Build and install the Arch package
        run: |
          pacman -Syu --noconfirm --needed git python pyside6 qt6-svg util-linux polkit python-build \
            python-installer python-setuptools python-wheel python-pytest dosfstools mtools e2fsprogs
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --noconfirm"
          pacman -U --noconfirm "$GITHUB_WORKSPACE"/recoverall-*.pkg.tar.zst
          recoverctl --version
          RALL_DEMO_PACE=0.02 recoverctl --demo list
          test -x /usr/lib/recoverall/recoverall-helper
          test -f /usr/share/polkit-1/actions/io.github.oreo1298.RecoverAll.policy
          QT_QPA_PLATFORM=offscreen python -c "import recoverall.gui.main_window; print('import OK')"
          pacman -Rns --noconfirm recoverall
          test ! -e /usr/bin/recoverctl

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System install with the installer, update, then uninstall
        run: |
          sudo ./packaging/install.sh --yes
          RALL_DEMO_PACE=0.02 recoverctl --demo list
          recoverctl doctor
          test -f /usr/local/share/applications/io.github.oreo1298.RecoverAll.desktop
          test -x /opt/recoverall/bin/recoverall-helper
          QT_QPA_PLATFORM=offscreen /opt/recoverall/venv/bin/python -c "import recoverall.gui.main_window"
          ./packaging/update.sh
          sudo ./packaging/uninstall.sh --purge
          test ! -e /usr/local/bin/recoverctl
          test ! -e /opt/recoverall
      - name: Per-user install
        run: |
          ./packaging/install.sh --user --no-deps
          ~/.local/bin/recoverctl --version
          ./packaging/uninstall.sh --user --purge
          test ! -e ~/.local/bin/recoverctl
